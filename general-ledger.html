<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>دفتر الأستاذ - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">دفتر الأستاذ<small>حركات الحسابات التفصيلية</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left">
                    <h2>دفتر الأستاذ</h2>
                    <p>عرض حركات كل حساب من القيود المرحّلة</p>
                </div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>

            <div class="card-panel" style="margin-bottom:14px">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label" style="font-size:12px;font-weight:600">الحساب</label>
                        <select class="form-select form-select-sm" id="accSel" onchange="renderLedger()"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" style="font-size:12px;font-weight:600">من تاريخ</label>
                        <input type="date" class="form-control form-control-sm" id="fromDate" value="2024-01-01" onchange="renderLedger()">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" style="font-size:12px;font-weight:600">إلى تاريخ</label>
                        <input type="date" class="form-control form-control-sm" id="toDate" value="2024-12-31" onchange="renderLedger()">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn-erp btn-erp-outline" style="width:100%" onclick="window.print()" title="طباعة"><i class="bi bi-printer"></i></button>
                    </div>
                </div>
            </div>

            <div class="stats-grid" id="statsRow"></div>

            <div class="panel">
                <div class="panel-header">
                    <h5 class="panel-title" id="ledgerTitle"><i class="bi bi-book"></i> حركات الحساب</h5>
                    <span class="record-count" id="recCount">0 حركة</span>
                </div>
                <div class="table-wrap">
                    <table class="table-custom">
                        <thead><tr><th>التاريخ</th><th>رقم القيد</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
                        <tbody id="tbody"></tbody>
                        <tfoot id="tfoot"></tfoot>
                    </table>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 1.0.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'دفتر الأستاذ', subtitle: 'حركات الحسابات التفصيلية', activeId: 'ledger' });
        
        var accounts = MockData.accounts.filter(function(a){ return !a.isGroup; });
        document.getElementById('accSel').innerHTML = accounts.map(function(a){
            return '<option value="'+a.id+'">'+a.code+' — '+a.name+'</option>';
        }).join('');

        function renderLedger(){
            var accId = Number(document.getElementById('accSel').value);
            var acc = accounts.find(function(a){ return a.id===accId; });
            if(!acc) return;
            document.getElementById('ledgerTitle').innerHTML = '<i class="bi bi-book"></i> '+acc.code+' — '+acc.name;

            // Build movements from journal entries (mock: distribute entry totals proportionally for demo)
            var moves = [];
            MockData.journalEntries.filter(function(j){ return j.status==='posted'; }).forEach(function(j){
                // Demo: show entry on accounts that "match" by hashing - better: alternate debit/credit on sample accounts
                var useDebit = (acc.type==='asset'||acc.type==='expense');
                var half = (j.totalDebit||0) / Math.max(accounts.length/3, 1);
                // More realistic: include entry if description or random based on id
                if ((j.id + accId) % 3 === 0 || (j.description && acc.name && j.description.indexOf(acc.name.split(' ')[0])>=0)) {
                    var d = useDebit ? (j.totalDebit * 0.3) : 0;
                    var c = !useDebit ? (j.totalCredit * 0.3) : 0;
                    if (d<1 && c<1) { d = useDebit ? j.totalDebit * 0.2 : 0; c = useDebit ? 0 : j.totalCredit * 0.2; }
                    moves.push({ date: j.date, number: j.number, desc: j.description, debit: Math.round(d), credit: Math.round(c) });
                }
            });
            // Always show opening from account balance structure
            if (!moves.length && (acc.balance||0) > 0) {
                moves.push({ date: '2024-01-01', number: '—', desc: 'رصيد افتتاحي / حركات مجمّعة', debit: (acc.type==='asset'||acc.type==='expense')?acc.balance:0, credit: (acc.type==='asset'||acc.type==='expense')?0:acc.balance });
            }
            moves.sort(function(a,b){ return a.date.localeCompare(b.date); });

            var bal = 0, td = 0, tc = 0;
            var rows = moves.map(function(m){
                bal += m.debit - m.credit;
                td += m.debit; tc += m.credit;
                return '<tr><td>'+MockData.formatDate(m.date)+'</td><td style="font-weight:600;color:var(--accent)">'+m.number+'</td><td>'+m.desc+'</td>'+
                    '<td>'+(m.debit?MockData.formatCurrency(m.debit):'—')+'</td>'+
                    '<td>'+(m.credit?MockData.formatCurrency(m.credit):'—')+'</td>'+
                    '<td style="font-weight:700">'+MockData.formatCurrency(bal)+'</td></tr>';
            }).join('');
            if (!moves.length) rows = '<tr><td colspan="6"><div class="empty-erp"><i class="bi bi-inbox"></i>لا توجد حركات على هذا الحساب في الفترة</div></td></tr>';
            document.getElementById('tbody').innerHTML = rows;
            document.getElementById('tfoot').innerHTML = moves.length ?
                '<tr><td colspan="3">الإجمالي</td><td>'+MockData.formatCurrency(td)+'</td><td>'+MockData.formatCurrency(tc)+'</td><td style="font-weight:800">'+MockData.formatCurrency(bal)+'</td></tr>' : '';
            document.getElementById('recCount').textContent = moves.length + ' حركة';
            document.getElementById('statsRow').innerHTML =
                '<div class="stat-card stat-gold"><div class="stat-number" style="font-size:14px">'+acc.code+'</div><div class="stat-label">كود الحساب</div></div>'+
                '<div class="stat-card stat-blue"><div class="stat-number" style="font-size:15px">'+MockData.formatCurrency(td)+'</div><div class="stat-label">إجمالي المدين</div></div>'+
                '<div class="stat-card stat-red"><div class="stat-number" style="font-size:15px">'+MockData.formatCurrency(tc)+'</div><div class="stat-label">إجمالي الدائن</div></div>'+
                '<div class="stat-card stat-green"><div class="stat-number" style="font-size:15px">'+MockData.formatCurrency(bal)+'</div><div class="stat-label">الرصيد</div></div>';
        }
        renderLedger();

    });
    </script>
</body>
</html>
