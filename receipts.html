<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>سندات القبض - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">سندات القبض<small>المبالغ المستلمة من العملاء</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>سندات القبض</h2><p>تسجيل المقبوضات من العملاء</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <button type="button" class="btn-erp btn-erp-primary" onclick="openR()"><i class="bi bi-plus-lg"></i> سند قبض</button>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>الرقم</th><th>العميل</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th><th>ملاحظات</th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div id="pageInfo" style="padding-top:10px;font-size:12px;color:var(--text-secondary)"></div>
            </div>
            <div id="rModal" class="erp-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(14,28,46,.45);z-index:10000;align-items:center;justify-content:center;padding:16px">
                <div style="background:var(--surface);border-radius:14px;width:100%;max-width:420px">
                    <div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)">
                        <strong>سند قبض جديد</strong>
                        <button type="button" onclick="closeErpModal('rModal')" style="border:none;background:none;font-size:18px;cursor:pointer">&times;</button>
                    </div>
                    <div style="padding:16px" class="row g-2">
                        <div class="col-12"><label class="form-label" style="font-size:12px;font-weight:600">العميل</label><select class="form-select form-select-sm" id="rCust"></select></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">التاريخ</label><input type="date" class="form-control form-control-sm" id="rDate"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">المبلغ *</label><input type="number" class="form-control form-control-sm" id="rAmt" min="0" step="0.01"></div>
                        <div class="col-12"><label class="form-label" style="font-size:12px;font-weight:600">ملاحظات</label><input class="form-control form-control-sm" id="rNotes"></div>
                    </div>
                    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
                        <button type="button" class="btn-erp btn-erp-primary" onclick="saveR()">حفظ</button>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="closeErpModal('rModal')">إلغاء</button>
                    </div>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 1.0.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'سندات القبض', subtitle: 'المبالغ المستلمة من العملاء', activeId: 'receipts' });
        
        var items = MockStore.get("receipts");
        var custMap={}; MockData.customers.forEach(function(c){custMap[c.id]=c.name;});
        function openR(){
            document.getElementById('rDate').value=new Date().toISOString().slice(0,10);
            document.getElementById('rAmt').value=''; document.getElementById('rNotes').value='';
            document.getElementById('rCust').innerHTML=MockData.customers.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>';}).join('');
            openErpModal('rModal');
        }
        function saveR(){
            var amt=Number(document.getElementById('rAmt').value);
            if(!amt||amt<=0){showToast('أدخل مبلغاً صحيحاً','error');return;}
            items.unshift({id:Date.now(), number:'RCP-'+String(items.length+1).padStart(3,'0'),
                customerId:Number(document.getElementById('rCust').value),
                date:document.getElementById('rDate').value, amount:amt, method:'cash',
                status:'confirmed', notes:document.getElementById('rNotes').value});
            MockStore.save('receipts', items); closeErpModal('rModal'); render(); showToast('تم حفظ سند القبض','success');
        }
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var list=items.filter(function(r){return !q||(r.number+(custMap[r.customerId]||'')+(r.notes||'')).toLowerCase().indexOf(q)>=0;});
            document.getElementById('tbody').innerHTML=list.length?list.map(function(r){
                return '<tr><td style="font-weight:600;color:var(--accent)">'+r.number+'</td><td>'+(custMap[r.customerId]||'—')+'</td>'+
                    '<td>'+MockData.formatDate(r.date)+'</td><td style="font-weight:700;color:var(--success)">'+MockData.formatCurrency(r.amount)+'</td>'+
                    '<td>'+statusBadge(r.status)+'</td><td>'+(r.notes||'—')+'</td></tr>';
            }).join(''):'<tr><td colspan="6"><div class="empty-erp"><i class="bi bi-inbox"></i>لا توجد سندات</div></td></tr>';
            document.getElementById('pageInfo').textContent='عرض '+list.length+' سند';
        }
        document.getElementById('searchInput').addEventListener('input',render);
        render();

    });
    </script>
</body>
</html>
