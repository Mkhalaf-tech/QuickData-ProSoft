<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>منخفض المخزون - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">منخفض المخزون<small>منتجات تحت الحد الأدنى</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>منخفض المخزون</h2><p>منتجات تحتاج إعادة طلب</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="stats-grid" id="statsRow"></div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <a class="btn-erp btn-erp-outline" href="products.html"><i class="bi bi-box-seam"></i> كل المنتجات</a>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>الكود</th><th>الاسم</th><th>الكمية الحالية</th><th>الحد الأدنى</th><th>النقص</th><th>سعر الشراء</th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 2.1.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'منخفض المخزون', subtitle: 'منتجات تحت الحد الأدنى', activeId: 'low-stock' });
        
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var list=MockData.products.filter(function(p){return p.qty<=p.minQty && (!q||(p.code+p.name).toLowerCase().indexOf(q)>=0);});
            document.getElementById('tbody').innerHTML=list.length?list.map(function(p){
                var gap=p.minQty-p.qty;
                return '<tr><td style="font-weight:600;color:var(--accent)">'+p.code+'</td><td style="font-weight:600">'+p.name+'</td>'+
                    '<td style="font-weight:700;color:var(--danger)">'+p.qty+'</td><td>'+p.minQty+'</td>'+
                    '<td><span class="badge badge-danger">'+gap+'</span></td><td>'+MockData.formatCurrency(p.purchasePrice)+'</td></tr>';
            }).join(''):'<tr><td colspan="6"><div class="empty-erp"><i class="bi bi-check-circle" style="color:var(--success)"></i>لا يوجد نقص في المخزون</div></td></tr>';
            document.getElementById('statsRow').innerHTML=
                '<div class="stat-card stat-red"><div class="stat-number">'+list.length+'</div><div class="stat-label">أصناف منخفضة</div></div>'+
                '<div class="stat-card stat-gold"><div class="stat-number">'+MockData.products.length+'</div><div class="stat-label">إجمالي الأصناف</div></div>';
        }
        document.getElementById('searchInput').addEventListener('input',render);render();

    });
    </script>
</body>
</html>
