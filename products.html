<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>المنتجات - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">المنتجات<small>الأصناف والأسعار والمخزون</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>المنتجات</h2><p>إدارة الأصناف والأسعار والكميات</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="stats-grid" id="statsRow"></div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <button type="button" class="btn-erp btn-erp-outline" onclick="exportProducts()"><i class="bi bi-download"></i> تصدير</button>
                    <button type="button" class="btn-erp btn-erp-primary" onclick="openP()"><i class="bi bi-plus-lg"></i> إضافة منتج</button>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>الكود</th><th>الاسم</th><th>سعر البيع</th><th>سعر الشراء</th><th>الكمية</th><th>الحد الأدنى</th><th>الحالة</th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div id="pageInfo" style="padding-top:10px;font-size:12px;color:var(--text-secondary)"></div>
            </div>
            <div id="pModal" class="erp-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(14,28,46,.45);z-index:10000;align-items:center;justify-content:center;padding:16px">
                <div style="background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow:auto">
                    <div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)">
                        <strong>إضافة منتج</strong>
                        <button type="button" onclick="closeErpModal('pModal')" style="border:none;background:none;font-size:18px;cursor:pointer">&times;</button>
                    </div>
                    <div style="padding:16px" class="row g-2">
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الكود</label><input class="form-control form-control-sm" id="pCode" placeholder="تلقائي"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الاسم *</label><input class="form-control form-control-sm" id="pName"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">سعر البيع *</label><input type="number" class="form-control form-control-sm" id="pSale" value="0"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">سعر الشراء</label><input type="number" class="form-control form-control-sm" id="pBuy" value="0"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الكمية</label><input type="number" class="form-control form-control-sm" id="pQty" value="0"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الحد الأدنى</label><input type="number" class="form-control form-control-sm" id="pMin" value="5"></div>
                    </div>
                    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
                        <button type="button" class="btn-erp btn-erp-primary" onclick="saveP()">حفظ</button>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="closeErpModal('pModal')">إلغاء</button>
                    </div>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 1.0.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'المنتجات', subtitle: 'الأصناف والأسعار والمخزون', activeId: 'products' });
        
        var products = MockStore.get("products");
        function exportProducts(){
            MockStore.exportCSV('products.csv', ['الكود','الاسم','سعر البيع','سعر الشراء','الكمية','الحد الأدنى'],
                products.map(function(x){ return [x.code,x.name,x.salePrice,x.purchasePrice,x.qty,x.minQty]; }));
            showToast('تم تصدير المنتجات','success');
        }
        function openP(){
            ['pCode','pName'].forEach(function(id){document.getElementById(id).value='';});
            document.getElementById('pSale').value=0; document.getElementById('pBuy').value=0;
            document.getElementById('pQty').value=0; document.getElementById('pMin').value=5;
            openErpModal('pModal');
        }
        function saveP(){
            var name=document.getElementById('pName').value.trim();
            var sale=Number(document.getElementById('pSale').value)||0;
            if(!name||sale<=0){showToast('الاسم وسعر البيع مطلوبان','error');return;}
            products.unshift({
                id:Date.now(), code:document.getElementById('pCode').value.trim()||('P-'+String(products.length+1).padStart(3,'0')),
                name:name, brand:'', categoryId:1, unitId:1, salePrice:sale,
                purchasePrice:Number(document.getElementById('pBuy').value)||0,
                qty:Number(document.getElementById('pQty').value)||0,
                minQty:Number(document.getElementById('pMin').value)||5,
                warehouseId:1, status:'active'
            });
            closeErpModal('pModal');
            MockStore.save('products', products); render(); showToast('تم حفظ المنتج','success');
        }
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var list=products.filter(function(p){return !q||(p.code+p.name).toLowerCase().indexOf(q)>=0;});
            document.getElementById('tbody').innerHTML=list.length?list.map(function(p){
                var low=p.qty<=p.minQty;
                return '<tr><td style="font-weight:600;color:var(--accent)">'+p.code+'</td><td style="font-weight:600">'+p.name+'</td>'+
                    '<td>'+MockData.formatCurrency(p.salePrice)+'</td><td>'+MockData.formatCurrency(p.purchasePrice)+'</td>'+
                    '<td style="font-weight:700;color:'+(low?'var(--danger)':'inherit')+'">'+p.qty+'</td><td>'+p.minQty+'</td>'+
                    '<td>'+(low?'<span class="badge badge-danger">منخفض</span>':statusBadge(p.status))+'</td></tr>';
            }).join(''):'<tr><td colspan="7"><div class="empty-erp"><i class="bi bi-inbox"></i>لا توجد منتجات</div></td></tr>';
            document.getElementById('pageInfo').textContent='عرض '+list.length+' منتج';
            var lowC=products.filter(function(p){return p.qty<=p.minQty;}).length;
            var val=products.reduce(function(s,p){return s+p.qty*p.purchasePrice;},0);
            document.getElementById('statsRow').innerHTML=
                '<div class="stat-card"><div class="stat-label">عدد المنتجات</div><div class="stat-value">'+products.length+'</div></div>'+
                '<div class="stat-card"><div class="stat-label">منخفض المخزون</div><div class="stat-value" style="color:var(--danger)">'+lowC+'</div></div>'+
                '<div class="stat-card"><div class="stat-label">قيمة المخزون</div><div class="stat-value" style="font-size:15px">'+MockData.formatCurrency(val)+'</div></div>';
        }
        document.getElementById('searchInput').addEventListener('input',render);
        render();

    });
    </script>
</body>
</html>
