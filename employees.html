<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>الموظفون - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">الموظفون<small>بيانات الموظفين والرواتب</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>الموظفون</h2><p>إدارة بيانات الموظفين والرواتب</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="stats-grid" id="statsRow"></div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <button type="button" class="btn-erp btn-erp-primary" onclick="openE()"><i class="bi bi-plus-lg"></i> إضافة موظف</button>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>الكود</th><th>الاسم</th><th>القسم</th><th>الوظيفة</th><th>الهاتف</th><th>الراتب</th><th>الحالة</th><th></th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div id="pageInfo" style="padding-top:10px;font-size:12px;color:var(--text-secondary)"></div>
            </div>
            <div id="eModal" class="erp-modal-overlay" style="display:none">
                <div class="erp-modal sm" style="max-width:520px">
                    <div class="erp-modal-header">
                        <strong id="eTitle">إضافة موظف</strong>
                        <button type="button" class="erp-modal-close" onclick="closeErpModal('eModal')" aria-label="إغلاق">&times;</button>
                    </div>
                    <div class="erp-modal-body"><div class="row g-2">
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الكود</label><input class="form-control form-control-sm" id="eCode" placeholder="تلقائي"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الاسم *</label><input class="form-control form-control-sm" id="eName"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">القسم</label><input class="form-control form-control-sm" id="eDept"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الوظيفة</label><input class="form-control form-control-sm" id="eJob"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الهاتف</label><input class="form-control form-control-sm" id="ePhone"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الراتب</label><input type="number" class="form-control form-control-sm" id="eSal" value="0"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">الحالة</label>
                            <select class="form-select form-select-sm" id="eStatus"><option value="active">نشط</option><option value="inactive">غير نشط</option></select></div>
                    </div>
                    <div class="erp-modal-footer">
                        <button type="button" class="btn-erp btn-erp-primary" onclick="saveE()">حفظ</button>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="closeErpModal('eModal')">إلغاء</button>
                    </div>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 2.2.0</span></div>
            </div>
        </footer>
    </main>
    <script src="supabase.js"></script>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'الموظفون', subtitle: 'بيانات الموظفين والرواتب', activeId: 'employees' });

        var items = [];
        var departments = [];
        var editId=null;

        async function loadEmployees(){
            try {
                items = await Supabase.rest('/employees?select=*,departments(name)&order=id.desc');
                departments = await Supabase.rest('/departments?select=*');
            } catch(e) {
                showToast(e.message || 'تعذّر تحميل الموظفين', 'error');
                items = []; departments = [];
            }
            render();
        }

        function deptName(e){ return (e.departments && e.departments.name) || '—'; }

        /** يبحث عن قسم بنفس الاسم أو ينشئه، ويرجّع الـ id الخاص به */
        async function resolveDepartmentId(name){
            name = (name||'').trim();
            if(!name) return null;
            var existing = departments.find(function(d){ return d.name === name; });
            if(existing) return existing.id;
            var created = await Supabase.rest('/departments', { method:'POST', body:{ name:name }, prefer:'return=representation' });
            var row = created && created[0];
            if(row) departments.push(row);
            return row ? row.id : null;
        }

        function openE(id){
            editId=id||null;
            document.getElementById('eTitle').textContent=id?'تعديل موظف':'إضافة موظف';
            var e=id?items.find(function(x){return x.id===id;}):null;
            document.getElementById('eCode').value=e?e.code:'';
            document.getElementById('eName').value=e?e.name:'';
            document.getElementById('eDept').value=e?deptName(e):'';
            document.getElementById('eJob').value=e?(e.job||''):'';
            document.getElementById('ePhone').value=e?(e.phone||''):'';
            document.getElementById('eSal').value=e?e.salary:0;
            document.getElementById('eStatus').value=e?e.status:'active';
            openErpModal('eModal');
        }
        async function saveE(){
            var name=document.getElementById('eName').value.trim();
            if(!name){showToast('الاسم مطلوب','error');return;}
            try {
                var deptId = await resolveDepartmentId(document.getElementById('eDept').value);
                var payload={
                    code: document.getElementById('eCode').value.trim() || ('EMP-'+String(items.length+1).padStart(3,'0')),
                    name: name, department_id: deptId,
                    job: document.getElementById('eJob').value || '—',
                    phone: document.getElementById('ePhone').value,
                    salary: Number(document.getElementById('eSal').value)||0,
                    status: document.getElementById('eStatus').value
                };
                if(editId){
                    await Supabase.rest('/employees?id=eq.'+editId, { method:'PATCH', body: payload, prefer:'return=minimal' });
                    showToast('تم التحديث','success');
                } else {
                    await Supabase.rest('/employees', { method:'POST', body: payload, prefer:'return=minimal' });
                    showToast('تم الإضافة','success');
                }
                closeErpModal('eModal');
                await loadEmployees();
            } catch(e) {
                showToast(e.message || 'فشل الحفظ', 'error');
            }
        }
        async function delE(id){
            if(!confirm('حذف الموظف؟'))return;
            try {
                await Supabase.rest('/employees?id=eq.'+id, { method:'DELETE' });
                showToast('تم الحذف','success');
                await loadEmployees();
            } catch(e) {
                showToast(e.message || 'فشل الحذف', 'error');
            }
        }
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var list=items.filter(function(e){return !q||(e.code+e.name+deptName(e)+(e.job||'')).toLowerCase().indexOf(q)>=0;});
            document.getElementById('tbody').innerHTML=list.length?list.map(function(e){
                return '<tr><td style="font-weight:600;color:var(--accent)">'+e.code+'</td><td style="font-weight:600">'+e.name+'</td><td>'+deptName(e)+'</td><td>'+(e.job||'—')+'</td>'+
                    '<td>'+(e.phone||'—')+'</td><td style="font-weight:700">'+MockData.formatCurrency(e.salary)+'</td><td>'+statusBadge(e.status)+'</td>'+
                    '<td style="white-space:nowrap"><button class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px" onclick="openE('+e.id+')">تعديل</button> '+
                    '<button class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px;color:var(--danger)" onclick="delE('+e.id+')">حذف</button></td></tr>';
            }).join(''):'<tr><td colspan="8"><div class="empty-erp"><i class="bi bi-inbox"></i><div class="empty-title">لا توجد بيانات</div></div></td></tr>';
            document.getElementById('pageInfo').textContent='عرض '+list.length+' موظف';
            var pay=items.reduce(function(s,e){return s+(e.status==='active'?e.salary:0);},0);
            document.getElementById('statsRow').innerHTML=
                '<div class="stat-card stat-gold"><div class="stat-number">'+items.length+'</div><div class="stat-label">الموظفون</div></div>'+
                '<div class="stat-card stat-green"><div class="stat-number">'+items.filter(function(e){return e.status==='active';}).length+'</div><div class="stat-label">نشط</div></div>'+
                '<div class="stat-card stat-blue"><div class="stat-number" style="font-size:15px">'+MockData.formatCurrency(pay)+'</div><div class="stat-label">إجمالي الرواتب</div></div>';
        }
        document.getElementById('searchInput').addEventListener('input',render);
        loadEmployees();

        // تعريض الدوال للـ onclick العام
        window.delE = delE;
        window.openE = openE;
        window.saveE = saveE;

    });
    </script>
</body>
</html>
