<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>العملاء - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">العملاء<small>إدارة العملاء والأرصدة المدينة</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>إدارة العملاء</h2><p>متابعة بيانات العملاء والأرصدة المدينة</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="stats-grid" id="statsRow"></div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث بالكود أو الاسم أو الهاتف..." /></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <select id="statusFilter" class="form-select form-select-sm" style="width:130px;font-size:12.5px">
                            <option value="">كل الحالات</option>
                            <option value="active">نشط</option>
                            <option value="inactive">غير نشط</option>
                        </select>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="exportCustomers()"><i class="bi bi-download"></i> تصدير</button>
                        <button type="button" class="btn-erp btn-erp-primary" onclick="openForm()"><i class="bi bi-plus-lg"></i> إضافة عميل</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr>
                            <th>الكود</th><th>الاسم</th><th>الهاتف</th><th>المدينة</th><th>الرصيد</th><th>الحالة</th><th>إجراءات</th>
                        </tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div id="pageInfo" style="padding-top:10px;font-size:12px;color:var(--text-secondary)"></div>
            </div>

            <!-- Modal Form -->
            <div id="formModal" class="erp-modal-overlay modal-overlay" style="display:none">
                <div class="erp-modal" style="max-width:560px">
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)">
                        <strong id="formTitle" style="font-size:14px">إضافة عميل</strong>
                        <button type="button" onclick="closeForm()" style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--text-tertiary)">&times;</button>
                    </div>
                    <div style="padding:18px">
                        <div class="row g-2">
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">الكود</label><input class="form-control form-control-sm" id="fCode" placeholder="تلقائي"></div>
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">الاسم *</label><input class="form-control form-control-sm" id="fName"></div>
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">الهاتف *</label><input class="form-control form-control-sm" id="fPhone"></div>
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">البريد</label><input class="form-control form-control-sm" id="fEmail" type="email"></div>
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">المدينة</label><input class="form-control form-control-sm" id="fCity"></div>
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">الرقم الضريبي</label><input class="form-control form-control-sm" id="fTax"></div>
                            <div class="col-12"><label class="form-label" style="font-size:12px;font-weight:600">العنوان</label><textarea class="form-control form-control-sm" id="fAddress" rows="2"></textarea></div>
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">رصيد افتتاحي</label><input class="form-control form-control-sm" type="number" id="fBalance" value="0"></div>
                            <div class="col-md-6"><label class="form-label" style="font-size:12px;font-weight:600">الحالة</label>
                                <select class="form-select form-select-sm" id="fStatus"><option value="active">نشط</option><option value="inactive">غير نشط</option></select>
                            </div>
                        </div>
                    </div>
                    <div class="erp-modal-footer">
                        <button type="button" class="btn-erp btn-erp-primary" onclick="saveCustomer()"><i class="bi bi-check-lg"></i> حفظ</button>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="closeForm()">إلغاء</button>
                    </div>
                </div>
            </div>

        </div>

        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left">
                    <span class="footer-version">الإصدار 2.2.0</span>
                </div>
            </div>
        </footer>
    </main>

    <script src="supabase.js"></script>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'العملاء', subtitle: 'إدارة العملاء والأرصدة المدينة', activeId: 'customers' });

        var customers = [];
        var editId = null;

        async function loadCustomers() {
            try {
                customers = await Supabase.rest('/customers?select=*&order=id.desc');
            } catch (e) {
                showToast(e.message || 'تعذّر تحميل العملاء', 'error');
                customers = [];
            }
            render();
        }

        function openForm(id) {
            editId = id || null;
            document.getElementById('formTitle').textContent = id ? 'تعديل عميل' : 'إضافة عميل';
            var c = id ? customers.find(function(x){return x.id===id;}) : null;
            document.getElementById('fCode').value = c ? c.code : '';
            document.getElementById('fName').value = c ? c.name : '';
            document.getElementById('fPhone').value = c ? c.phone : '';
            document.getElementById('fEmail').value = c ? (c.email||'') : '';
            document.getElementById('fCity').value = c ? (c.city||'') : '';
            document.getElementById('fTax').value = c ? (c.tax_number||'') : '';
            document.getElementById('fAddress').value = c ? (c.address||'') : '';
            document.getElementById('fBalance').value = c ? c.balance : 0;
            document.getElementById('fStatus').value = c ? c.status : 'active';
            openErpModal('formModal');
        }
        function closeForm(){ closeErpModal('formModal'); }
        async function saveCustomer(){
            var name = document.getElementById('fName').value.trim();
            var phone = document.getElementById('fPhone').value.trim();
            if(!name||!phone){ showToast('الاسم والهاتف مطلوبان','error'); return; }
            var payload = {
                code: document.getElementById('fCode').value.trim() || ('C-'+String(customers.length+1).padStart(3,'0')),
                name: name, phone: phone,
                email: document.getElementById('fEmail').value.trim(),
                city: document.getElementById('fCity').value.trim()||'—',
                tax_number: document.getElementById('fTax').value.trim(),
                address: document.getElementById('fAddress').value.trim(),
                balance: Number(document.getElementById('fBalance').value)||0,
                status: document.getElementById('fStatus').value
            };
            try {
                if(editId){
                    await Supabase.rest('/customers?id=eq.'+editId, { method:'PATCH', body: payload, prefer:'return=minimal' });
                    showToast('تم تحديث العميل','success');
                } else {
                    await Supabase.rest('/customers', { method:'POST', body: payload, prefer:'return=minimal' });
                    showToast('تم إضافة العميل','success');
                }
                closeForm();
                await loadCustomers();
            } catch (e) {
                showToast(e.message || 'فشل حفظ العميل', 'error');
            }
        }
        async function delCustomer(id){
            if(!confirm('حذف هذا العميل؟')) return;
            try {
                await Supabase.rest('/customers?id=eq.'+id, { method:'DELETE' });
                showToast('تم الحذف','success');
                await loadCustomers();
            } catch (e) {
                showToast(e.message || 'فشل الحذف', 'error');
            }
        }
        function exportCustomers(){
            MockStore.exportCSV('customers.csv', ['الكود','الاسم','الهاتف','المدينة','الرصيد','الحالة'],
                customers.map(function(x){ return [x.code,x.name,x.phone,x.city||'',x.balance,x.status]; }));
            showToast('تم تصدير العملاء','success');
        }
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var st=document.getElementById('statusFilter').value;
            var rows=customers.filter(function(c){
                if(st&&c.status!==st)return false;
                if(q&&(c.code+c.name+c.phone+(c.city||'')).toLowerCase().indexOf(q)<0)return false;
                return true;
            });
            document.getElementById('tbody').innerHTML = rows.length ? rows.map(function(c){
                return '<tr>'+
                    '<td style="font-weight:600;color:var(--accent)">'+c.code+'</td>'+
                    '<td style="font-weight:600">'+c.name+'</td>'+
                    '<td>'+c.phone+'</td><td>'+(c.city||'—')+'</td>'+
                    '<td style="font-weight:700;color:'+(c.balance>0?'var(--danger)':'var(--success)')+'">'+MockData.formatCurrency(c.balance)+'</td>'+
                    '<td>'+statusBadge(c.status)+'</td>'+
                    '<td style="white-space:nowrap">'+
                    '<button class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px" onclick="openForm('+c.id+')">تعديل</button> '+
                    '<a class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px" href="customer-statement.html?id='+c.id+'">كشف</a> '+
                    '<button class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px;color:var(--danger)" onclick="delCustomer('+c.id+')">حذف</button>'+
                    '</td></tr>';
            }).join('') : '<tr><td colspan="7"><div class="empty-erp"><i class="bi bi-inbox"></i><div class="empty-title">لا توجد بيانات</div></div></td></tr>';
            document.getElementById('pageInfo').textContent = 'عرض '+rows.length+' من '+customers.length+' عميل';
            var sum = customers.reduce(function(s,c){return s+c.balance;},0);
            var active = customers.filter(function(c){return c.status==='active';}).length;
            document.getElementById('statsRow').innerHTML =
                '<div class="stat-card"><div class="stat-label">إجمالي العملاء</div><div class="stat-value">'+customers.length+'</div></div>'+
                '<div class="stat-card"><div class="stat-label">نشط</div><div class="stat-value">'+active+'</div></div>'+
                '<div class="stat-card"><div class="stat-label">إجمالي المدين</div><div class="stat-value" style="font-size:16px">'+MockData.formatCurrency(sum)+'</div></div>';
        }
        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('statusFilter').addEventListener('change', render);
        loadCustomers();

        // تعريض الدوال للـ onclick العام
        window.closeForm = closeForm;
        window.delCustomer = delCustomer;
        window.exportCustomers = exportCustomers;
        window.openForm = openForm;
        window.saveCustomer = saveCustomer;

    });
    </script>
</body>
</html>
