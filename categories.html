<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>التصنيفات - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">التصنيفات<small>تصنيفات المنتجات</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>تصنيفات المنتجات</h2><p>إدارة التصنيفات المستخدمة في المخزون</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="stats-grid" id="statsRow"></div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <div style="display:flex;gap:8px">
                        <a class="btn-erp btn-erp-outline" href="products.html"><i class="bi bi-box-seam"></i> المنتجات</a>
                        <button type="button" class="btn-erp btn-erp-primary" onclick="openC()"><i class="bi bi-plus-lg"></i> تصنيف جديد</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>#</th><th>اسم التصنيف</th><th>عدد المنتجات</th><th></th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
            <div id="cModal" class="erp-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(14,28,46,.45);z-index:10000;align-items:center;justify-content:center;padding:16px">
                <div style="background:var(--surface);border-radius:14px;width:100%;max-width:380px">
                    <div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)">
                        <strong>تصنيف جديد</strong>
                        <button type="button" onclick="closeErpModal('cModal')" style="border:none;background:none;font-size:18px;cursor:pointer">&times;</button>
                    </div>
                    <div style="padding:16px">
                        <label class="form-label" style="font-size:12px;font-weight:600">الاسم *</label>
                        <input class="form-control form-control-sm" id="cName">
                    </div>
                    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
                        <button type="button" class="btn-erp btn-erp-primary" onclick="saveC()">حفظ</button>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="closeErpModal('cModal')">إلغاء</button>
                    </div>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 2.1.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'التصنيفات', subtitle: 'تصنيفات المنتجات', activeId: 'products' });
        
        var cats = MockStore.get("categories");
        function openC(){ document.getElementById('cName').value=''; openErpModal('cModal'); }
        function saveC(){
            var n=document.getElementById('cName').value.trim();
            if(!n){showToast('الاسم مطلوب','error');return;}
            cats.push({id:Date.now(), name:n});
            MockStore.save("categories", cats); closeErpModal('cModal'); render(); showToast('تم الحفظ','success');
        }
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var list=cats.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0;});
            document.getElementById('tbody').innerHTML=list.map(function(c,i){
                var cnt=MockData.products.filter(function(p){return p.categoryId===c.id;}).length;
                return '<tr><td>'+(i+1)+'</td><td style="font-weight:600">'+c.name+'</td><td>'+cnt+'</td><td></td></tr>';
            }).join('')||'<tr><td colspan="4"><div class="empty-erp"><i class="bi bi-inbox"></i>لا تصنيفات</div></td></tr>';
            document.getElementById('statsRow').innerHTML='<div class="stat-card stat-gold"><div class="stat-number">'+cats.length+'</div><div class="stat-label">التصنيفات</div></div>';
        }
        document.getElementById('searchInput').addEventListener('input',render); render();

        // تعريض الدوال للـ onclick العام
        window.openC = openC;
        window.saveC = saveC;

    });
    </script>
</body>
</html>
