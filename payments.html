<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>سندات الصرف - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">سندات الصرف<small>المدفوعات للموردين والمصروفات</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>سندات الصرف</h2><p>تسجيل المدفوعات للموردين</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <button type="button" class="btn-erp btn-erp-primary" onclick="openPay()"><i class="bi bi-plus-lg"></i> سند صرف</button>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>الرقم</th><th>الجهة</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th><th>ملاحظات</th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div id="pageInfo" style="padding-top:10px;font-size:12px;color:var(--text-secondary)"></div>
            </div>
            <div id="payModal" class="erp-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(14,28,46,.45);z-index:10000;align-items:center;justify-content:center;padding:16px">
                <div style="background:var(--surface);border-radius:14px;width:100%;max-width:420px">
                    <div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)">
                        <strong>سند صرف جديد</strong>
                        <button type="button" onclick="closeErpModal('payModal')" style="border:none;background:none;font-size:18px;cursor:pointer">&times;</button>
                    </div>
                    <div style="padding:16px" class="row g-2">
                        <div class="col-12"><label class="form-label" style="font-size:12px;font-weight:600">المورد</label><select class="form-select form-select-sm" id="paySup"></select></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">التاريخ</label><input type="date" class="form-control form-control-sm" id="payDate"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">المبلغ *</label><input type="number" class="form-control form-control-sm" id="payAmt" min="0" step="0.01"></div>
                        <div class="col-12"><label class="form-label" style="font-size:12px;font-weight:600">ملاحظات</label><input class="form-control form-control-sm" id="payNotes"></div>
                    </div>
                    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
                        <button type="button" class="btn-erp btn-erp-primary" onclick="savePay()">حفظ</button>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="closeErpModal('payModal')">إلغاء</button>
                    </div>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 1.0.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'سندات الصرف', subtitle: 'المدفوعات للموردين والمصروفات', activeId: 'payments' });
        
        var items = MockStore.get("paymentsList");
        var supMap={}; MockData.suppliers.forEach(function(s){supMap[s.id]=s.name;});
        function openPay(){
            document.getElementById('payDate').value=new Date().toISOString().slice(0,10);
            document.getElementById('payAmt').value=''; document.getElementById('payNotes').value='';
            document.getElementById('paySup').innerHTML=MockData.suppliers.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join('');
            openErpModal('payModal');
        }
        function savePay(){
            var amt=Number(document.getElementById('payAmt').value);
            if(!amt||amt<=0){showToast('أدخل مبلغاً صحيحاً','error');return;}
            items.unshift({id:Date.now(),number:'PAY-'+String(items.length+1).padStart(3,'0'),
                supplierId:Number(document.getElementById('paySup').value),
                date:document.getElementById('payDate').value, amount:amt, method:'bank',
                status:'confirmed', notes:document.getElementById('payNotes').value});
            MockStore.save('paymentsList', items); closeErpModal('payModal'); render(); showToast('تم حفظ سند الصرف','success');
        }
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var list=items.filter(function(p){return !q||(p.number+(supMap[p.supplierId]||'')+(p.notes||'')).toLowerCase().indexOf(q)>=0;});
            document.getElementById('tbody').innerHTML=list.length?list.map(function(p){
                return '<tr><td style="font-weight:600;color:var(--accent)">'+p.number+'</td><td>'+(p.supplierId?supMap[p.supplierId]:'مصروفات عامة')+'</td>'+
                    '<td>'+MockData.formatDate(p.date)+'</td><td style="font-weight:700;color:var(--danger)">'+MockData.formatCurrency(p.amount)+'</td>'+
                    '<td>'+statusBadge(p.status)+'</td><td>'+(p.notes||'—')+'</td></tr>';
            }).join(''):'<tr><td colspan="6"><div class="empty-erp"><i class="bi bi-inbox"></i>لا توجد سندات</div></td></tr>';
            document.getElementById('pageInfo').textContent='عرض '+list.length+' سند';
        }
        document.getElementById('searchInput').addEventListener('input',render);
        render();

    });
    </script>
</body>
</html>
