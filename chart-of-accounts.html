<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>دليل الحسابات - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">دليل الحسابات<small>شجرة الحسابات المحاسبية</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>دليل الحسابات</h2><p>شجرة الحسابات والأرصدة</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="stats-grid" id="statsRow"></div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث بالكود أو الاسم..." /></div>
                    <select id="typeFilter" class="form-select form-select-sm" style="width:140px;font-size:12.5px">
                        <option value="">كل الأنواع</option>
                        <option value="asset">أصول</option>
                        <option value="liability">خصوم</option>
                        <option value="equity">حقوق ملكية</option>
                        <option value="revenue">إيرادات</option>
                        <option value="expense">مصروفات</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>الكود</th><th>الاسم</th><th>النوع</th><th>مستوى</th><th>الرصيد</th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div id="pageInfo" style="padding-top:10px;font-size:12px;color:var(--text-secondary)"></div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 2.2.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'دليل الحسابات', subtitle: 'شجرة الحسابات المحاسبية', activeId: 'coa' });
        
        var typeAr={asset:'أصل',liability:'خصم',equity:'حقوق ملكية',revenue:'إيراد',expense:'مصروف'};
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var tf=document.getElementById('typeFilter').value;
            var list=MockData.accounts.filter(function(a){
                if(tf&&a.type!==tf)return false;
                if(q&&(a.code+a.name).toLowerCase().indexOf(q)<0)return false;
                return true;
            });
            document.getElementById('tbody').innerHTML=list.map(function(a){
                var pad=a.isGroup?0:12;
                return '<tr style="'+(a.isGroup?'font-weight:800;background:var(--surface-alt)':'')+'">'+
                    '<td style="font-weight:600;color:var(--accent);padding-right:'+(8+pad)+'px">'+a.code+'</td>'+
                    '<td style="padding-right:'+pad+'px">'+a.name+'</td>'+
                    '<td>'+(typeAr[a.type]||a.type||'—')+'</td>'+
                    '<td>'+(a.isGroup?'مجموعة':'حساب')+'</td>'+
                    '<td style="font-weight:700">'+(a.balance!=null?MockData.formatCurrency(a.balance):'—')+'</td></tr>';
            }).join('')||'<tr><td colspan="5"><div class="empty-erp"><i class="bi bi-inbox"></i><div class="empty-title">لا بيانات</div></div></td></tr>';
            document.getElementById('pageInfo').textContent='عرض '+list.length+' حساب';
            var leaf=MockData.accounts.filter(function(a){return !a.isGroup;});
            document.getElementById('statsRow').innerHTML=
                '<div class="stat-card stat-gold"><div class="stat-number">'+MockData.accounts.length+'</div><div class="stat-label">إجمالي الحسابات</div></div>'+
                '<div class="stat-card stat-blue"><div class="stat-number">'+leaf.length+'</div><div class="stat-label">حسابات فرعية</div></div>';
        }
        document.getElementById('searchInput').addEventListener('input',render);
        document.getElementById('typeFilter').addEventListener('change',render);
        render();

    });
    </script>
</body>
</html>
