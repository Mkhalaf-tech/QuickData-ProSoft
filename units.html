<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>وحدات القياس - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">وحدات القياس<small>الوحدات المستخدمة في المنتجات</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="page-header">
                <div class="ph-left"><h2>وحدات القياس</h2><p>إدارة الوحدات المستخدمة في المنتجات</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <a class="btn-erp btn-erp-outline" href="products.html"><i class="bi bi-box-seam"></i> المنتجات</a>
                    <button type="button" class="btn-erp btn-erp-primary" onclick="openU()"><i class="bi bi-plus-lg"></i> وحدة جديدة</button>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>#</th><th>الوحدة</th><th>عدد المنتجات</th><th></th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="uModal" class="erp-modal-overlay" style="display:none">
            <div class="erp-modal sm" style="max-width:420px">
                <div class="erp-modal-header">
                    <strong id="uTitle">وحدة جديدة</strong>
                    <button type="button" class="erp-modal-close" onclick="closeErpModal('uModal')">&times;</button>
                </div>
                <div class="erp-modal-body">
                    <label class="form-label" style="font-size:12px;font-weight:600">اسم الوحدة *</label>
                    <input class="form-control form-control-sm" id="uName" placeholder="مثال: قطعة، كيلو، علبة">
                </div>
                <div class="erp-modal-footer">
                    <button type="button" class="btn-erp btn-erp-primary" onclick="saveU()">حفظ</button>
                    <button type="button" class="btn-erp btn-erp-outline" onclick="closeErpModal('uModal')">إلغاء</button>
                </div>
            </div>
        </div>

        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 2.2.0</span></div>
            </div>
        </footer>
    </main>
    <script src="supabase.js"></script>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'وحدات القياس', subtitle: 'وحدات الأصناف', activeId: 'units' });

        var units = [];
        var productCounts = {};
        var editId = null;

        async function loadUnits() {
            try {
                units = await Supabase.rest('/units?select=*&order=id.asc');
                var prods = await Supabase.rest('/products?select=id,unit_id');
                productCounts = {};
                prods.forEach(function(p){
                    if (p.unit_id) productCounts[p.unit_id] = (productCounts[p.unit_id]||0) + 1;
                });
            } catch(e) {
                showToast(e.message || 'تعذّر تحميل الوحدات', 'error');
                units = []; productCounts = {};
            }
            render();
        }

        function productCount(unitId) { return productCounts[unitId] || 0; }

        function openU(id) {
            editId = id || null;
            document.getElementById('uTitle').textContent = id ? 'تعديل وحدة' : 'وحدة جديدة';
            var u = id ? units.find(function (x) { return x.id === id; }) : null;
            document.getElementById('uName').value = u ? u.name : '';
            openErpModal('uModal');
            setTimeout(function () { document.getElementById('uName').focus(); }, 50);
        }

        async function saveU() {
            var name = document.getElementById('uName').value.trim();
            if (!name) { showToast('أدخل اسم الوحدة', 'error'); return; }
            try {
                if (editId) {
                    await Supabase.rest('/units?id=eq.'+editId, { method:'PATCH', body:{ name: name }, prefer:'return=minimal' });
                } else {
                    await Supabase.rest('/units', { method:'POST', body:{ name: name }, prefer:'return=minimal' });
                }
                closeErpModal('uModal');
                await loadUnits();
                showToast('تم الحفظ', 'success');
            } catch(e) {
                showToast(e.message || 'فشل الحفظ', 'error');
            }
        }

        async function delU(id) {
            var cnt = productCount(id);
            if (cnt > 0) { showToast('لا يمكن الحذف: مرتبطة بـ ' + cnt + ' منتج', 'error'); return; }
            if (!confirm('حذف هذه الوحدة؟')) return;
            try {
                await Supabase.rest('/units?id=eq.'+id, { method:'DELETE' });
                await loadUnits();
                showToast('تم الحذف', 'success');
            } catch(e) {
                showToast(e.message || 'فشل الحذف', 'error');
            }
        }

        function render() {
            var q = (document.getElementById('searchInput').value || '').toLowerCase();
            var list = units.filter(function (u) { return !q || u.name.toLowerCase().indexOf(q) >= 0; });
            document.getElementById('tbody').innerHTML = list.length ? list.map(function (u, i) {
                var cnt = productCount(u.id);
                return '<tr><td>' + (i + 1) + '</td><td style="font-weight:600">' + u.name + '</td><td>' + cnt + '</td>' +
                    '<td style="white-space:nowrap">' +
                    '<button class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px" onclick="openU(' + u.id + ')">تعديل</button> ' +
                    '<button class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px;color:var(--danger)" onclick="delU(' + u.id + ')">حذف</button>' +
                    '</td></tr>';
            }).join('') : '<tr><td colspan="4"><div class="empty-erp"><i class="bi bi-inbox"></i><div class="empty-title">لا وحدات</div></div></td></tr>';
        }

        document.getElementById('searchInput').addEventListener('input', render);
        loadUnits();

        window.openU = openU;
        window.saveU = saveU;
        window.delU = delU;
    });
    </script>
</body>
</html>
