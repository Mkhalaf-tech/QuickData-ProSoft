<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المصروفات - QuickData ProSoft</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/erp-theme.css" />
  
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-content" id="main-content">
    <header class="top-header">
      <div class="header-right">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="breadcrumb"><a href="index.html">الرئيسية</a><span class="sep">/</span><span>المصروفات</span><span class="sep">/</span><span>المصروفات</span></div>
          <div class="page-title-header">المصروفات</div>
        </div>
      </div>
      <div class="header-left">
        <div class="user-chip"><div class="user-avatar">م</div><span class="user-name">مدير النظام</span></div>
      </div>
    </header>
    <div class="content-area">

      <div class="page-header">
        <div><h1>المصروفات</h1><div class="page-desc">إدارة المصروفات</div></div>
        <button class="btn btn-primary" onclick="App.showToast('قريباً','info')"><i class="bi bi-plus-lg"></i> إضافة</button>
      </div>
      <div class="card">
        <div class="table-toolbar"><div class="search-box"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div></div>
        <div class="table-responsive"><table class="data-table"><thead><tr><th>الرقم</th><th>التاريخ</th><th>المبلغ</th><th>الوصف</th><th>الحالة</th></tr></thead><tbody id="tbody"></tbody></table></div>
        <div class="pagination-bar"><span id="pageInfo"></span></div>
      </div>

    </div>
    <footer class="app-footer"><span id="footerText"></span></footer>
  </div>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      App.initPage({ title: "المصروفات", activeId: "expenses" });
      
function render(){
  var q=(document.getElementById("searchInput").value||"").toLowerCase();
  var list=(MockData.expenses).filter(function(item){return !q||JSON.stringify(item).toLowerCase().indexOf(q)>=0;});
  var tbody=document.getElementById("tbody");
  if(!list.length)tbody.innerHTML='<tr><td colspan="5">'+App.emptyState()+'</td></tr>';
  else tbody.innerHTML=list.map(function(item){return '<tr><td style="font-weight:600;color:var(--accent)">'+item.number+'</td><td>'+MockData.formatDate(item.date)+'</td><td style="font-weight:700">'+MockData.formatCurrency(item.amount)+'</td><td>'+item.description+'</td><td>'+App.statusBadge(item.status)+'</td></tr>';}).join("");
  document.getElementById("pageInfo").textContent="عرض "+list.length+" سجل";
}
document.getElementById("searchInput").addEventListener("input",render);
render();

    });
  </script>
</body>
</html>
