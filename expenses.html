<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EQ%3C/text%3E%3C/svg%3E" />
    <title>المصروفات - QuickData ProSoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="page-layout.css" />
</head>
<body>
<script>(function(){try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark-mode');}catch(e){}})();</script>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content" id="mainContent">
        <nav class="navbar-custom">
            <div class="navbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <div class="navbar-logo-container">
                    <span class="navbar-logo-text" id="navbarBrandText">QuickData <span>ProSoft</span></span>
                </div>
                <h4 class="page-title" id="pageTitleText">المصروفات<small>المصروفات التشغيلية والإدارية</small></h4>
            </div>
            <div class="navbar-right">
                <button class="nav-btn" id="darkModeToggle" type="button" title="الوضع الليلي"><i class="bi bi-moon-fill"></i></button>
                <button class="nav-btn" id="refreshBtn" type="button" title="تحديث"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="nav-btn" id="notifBtn" type="button" title="الإشعارات"><i class="bi bi-bell-fill"></i></button>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">مدير النظام</span>
                        <span class="user-role" id="userRole">QuickData ProSoft</span>
                    </div>
                    <div class="user-avatar">م</div>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">

            <div class="page-header">
                <div class="ph-left"><h2>المصروفات</h2><p>تسجيل ومتابعة المصروفات</p></div>
                <div class="ph-right"><strong>اليوم</strong><span id="headerDate">—</span></div>
            </div>
            <div class="card-panel">
                <div class="toolbar-erp">
                    <div class="search-erp"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="بحث..." /></div>
                    <button type="button" class="btn-erp btn-erp-outline" onclick="MockStore.exportCSV('expenses.csv',['الرقم','التاريخ','المبلغ','الوصف','الحالة'],items.map(function(x){return[x.number,x.date,x.amount,x.description,x.status];}));showToast('تم التصدير','success')"><i class="bi bi-download"></i> تصدير</button>
                    <button type="button" class="btn-erp btn-erp-primary" onclick="openE()"><i class="bi bi-plus-lg"></i> مصروف جديد</button>
                </div>
                <div class="table-responsive">
                    <table class="table-erp">
                        <thead><tr><th>الرقم</th><th>النوع</th><th>التاريخ</th><th>المبلغ</th><th>الوصف</th><th>الحالة</th><th></th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div id="pageInfo" style="padding-top:10px;font-size:12px;color:var(--text-secondary)"></div>
            </div>
            <div id="eModal" class="erp-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(14,28,46,.45);z-index:10000;align-items:center;justify-content:center;padding:16px">
                <div style="background:var(--surface);border-radius:14px;width:100%;max-width:420px">
                    <div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)">
                        <strong>مصروف جديد</strong>
                        <button type="button" onclick="closeErpModal('eModal')" style="border:none;background:none;font-size:18px;cursor:pointer">&times;</button>
                    </div>
                    <div style="padding:16px" class="row g-2">
                        <div class="col-12"><label class="form-label" style="font-size:12px;font-weight:600">النوع</label><select class="form-select form-select-sm" id="eType"></select></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">التاريخ</label><input type="date" class="form-control form-control-sm" id="eDate"></div>
                        <div class="col-6"><label class="form-label" style="font-size:12px;font-weight:600">المبلغ *</label><input type="number" class="form-control form-control-sm" id="eAmt" min="0" step="0.01"></div>
                        <div class="col-12"><label class="form-label" style="font-size:12px;font-weight:600">الوصف *</label><input class="form-control form-control-sm" id="eDesc"></div>
                    </div>
                    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
                        <button type="button" class="btn-erp btn-erp-primary" onclick="saveE()">حفظ</button>
                        <button type="button" class="btn-erp btn-erp-outline" onclick="closeErpModal('eModal')">إلغاء</button>
                    </div>
                </div>
            </div>

        </div>
        <footer class="footer-custom">
            <div class="footer-content">
                <div class="footer-right">
                    <span class="footer-brand">QuickData <span>ProSoft</span></span>
                    <span class="footer-divider">|</span>
                    <span class="footer-copy">© 2026 جميع الحقوق محفوظة — حلول إدارة الأعمال الاحترافية</span>
                </div>
                <div class="footer-left"><span class="footer-version">الإصدار 2.0.0</span></div>
            </div>
        </footer>
    </main>
    <script src="mock-data.js"></script>
    <script src="store.js"></script>
    <script src="layout-erp.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        initERPPage({ title: 'المصروفات', subtitle: 'المصروفات التشغيلية والإدارية', activeId: 'expenses' });
        
        var items = MockStore.get("expenses");
        var typeMap={}; MockData.expenseTypes.forEach(function(t){typeMap[t.id]=t.name;});
        function openE(){
            document.getElementById('eDate').value=new Date().toISOString().slice(0,10);
            document.getElementById('eAmt').value=''; document.getElementById('eDesc').value='';
            document.getElementById('eType').innerHTML=MockData.expenseTypes.map(function(t){return '<option value="'+t.id+'">'+t.name+'</option>';}).join('');
            openErpModal('eModal');
        }
        function saveE(){
            var amt=Number(document.getElementById('eAmt').value), desc=document.getElementById('eDesc').value.trim();
            if(!amt||amt<=0||!desc){showToast('المبلغ والوصف مطلوبان','error');return;}
            items.unshift({id:Date.now(), number:'EXP-'+String(items.length+1).padStart(3,'0'),
                typeId:Number(document.getElementById('eType').value), date:document.getElementById('eDate').value,
                amount:amt, description:desc, status:'pending', paymentMethod:'cash'});
            MockStore.save('expenses', items); closeErpModal('eModal'); render(); showToast('تم حفظ المصروف','success');
        }
        function approveE(id){
            var e=items.find(function(x){return x.id===id;}); if(e){e.status='approved'; MockStore.save('expenses', items); render(); showToast('تم الاعتماد','success');}
        }
        function render(){
            var q=(document.getElementById('searchInput').value||'').toLowerCase();
            var list=items.filter(function(e){return !q||(e.number+e.description+(typeMap[e.typeId]||'')).toLowerCase().indexOf(q)>=0;});
            document.getElementById('tbody').innerHTML=list.length?list.map(function(e){
                return '<tr><td style="font-weight:600;color:var(--accent)">'+e.number+'</td><td>'+(typeMap[e.typeId]||'—')+'</td>'+
                    '<td>'+MockData.formatDate(e.date)+'</td><td style="font-weight:700">'+MockData.formatCurrency(e.amount)+'</td>'+
                    '<td>'+e.description+'</td><td>'+statusBadge(e.status)+'</td>'+
                    '<td>'+(e.status==='pending'?'<button class="btn-erp btn-erp-outline" style="padding:3px 8px;font-size:11px" onclick="approveE('+e.id+')">اعتماد</button>':'')+'</td></tr>';
            }).join(''):'<tr><td colspan="7"><div class="empty-erp"><i class="bi bi-inbox"></i>لا توجد مصروفات</div></td></tr>';
            document.getElementById('pageInfo').textContent='عرض '+list.length+' مصروف';
        }
        document.getElementById('searchInput').addEventListener('input',render);
        render();

    });
    </script>
</body>
</html>
